<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Знак приложения Loadika.
    Монохромный силуэт (причёска/голова) с вырезанным лицом: используется и как CSS-маска
    (сайдбар, favicon), и как исходник для генератора иконок (tools/appicon), который
    перекрашивает этот цвет в белый. Фон прозрачный — иначе маска превратилась бы в квадрат.
    Вырез лица — отдельный подпуть с противоположным обходом (дуги sweep=1): генератор иконок
    (oksvg/rasterx) считает по nonzero, поэтому дырка получается именно за счёт обратного обхода;
    fill-rule="evenodd" оставлен для браузерных растризаторов (CSS-маска).
  -->
  <path
    fill="#9b5aa8"
    fill-rule="evenodd"
    d="M 256 80
       C 180 80, 120 120, 110 200
       C 105 240, 115 280, 130 320
       L 140 360
       L 160 340
       L 170 380
       L 190 350
       L 200 390
       L 220 360
       L 230 400
       L 256 420
       L 282 400
       L 292 360
       L 312 390
       L 322 350
       L 342 380
       L 352 340
       L 372 360
       L 382 320
       C 397 280, 407 240, 402 200
       C 392 120, 332 80, 256 80 Z
       M 176 252
       a 80 86 0 1 1 160 0
       a 80 86 0 1 1 -160 0 Z"
  />
</svg>
